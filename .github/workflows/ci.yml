# CI: Go test/vet + frontend lint/build + sqlc generate consistency check
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  go-test:
    name: Go test + vet
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://goproxy.cn,direct
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teammate
          POSTGRES_DB: teammate
        ports:
          - "15432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "16379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: http://host.docker.internal:3000/actions/checkout@v4
      - name: Checkout agentd (sibling repo)
        uses: http://host.docker.internal:3000/actions/checkout@v4
        with:
          repository: zhenfeng/teammate-agentd
          ref: master
          path: agentd
      - name: Install postgresql client
        run: apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - uses: http://host.docker.internal:3000/actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Create test database
        run: PGPASSWORD=teammate psql -h postgres -p 5432 -U postgres -c "CREATE DATABASE teammate_test;"
      - name: Point test suite at service containers
        run: |
          echo "TEAMS_TEST_DATABASE_URL=postgres://postgres:teammate@postgres:5432/teammate_test?sslmode=disable" >> $GITHUB_ENV
          echo "TEAMS_TEST_REDIS_URL=redis://redis:6379/0" >> $GITHUB_ENV
      - name: Migrate (server)
        run: |
          TEAMS_DATABASE_URL="postgres://postgres:teammate@postgres:5432/teammate?sslmode=disable"             go run ./cmd/teammate-server migrate ./internal/db/migrations
      - name: Vet (server)
        run: go vet ./...
      - name: Test (server)
        run: go test ./... -count=1
      - name: Vet (agentd)
        working-directory: agentd
        run: go vet ./...
      - name: Test (agentd)
        working-directory: agentd
        run: go test ./... -count=1

  web-checks:
    name: Web lint + build + unit tests
    runs-on: ubuntu-latest
    env:
      npm_config_registry: https://registry.npmmirror.com
    defaults:
      run:
        working-directory: web
    steps:
      - uses: http://host.docker.internal:3000/actions/checkout@v4
      - uses: http://host.docker.internal:3000/pnpm/action-setup@v4
        with:
          version: 10
      - uses: http://host.docker.internal:3000/actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  sqlc-check:
    name: sqlc generate drift check
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - uses: http://host.docker.internal:3000/actions/checkout@v4
      - uses: http://host.docker.internal:3000/actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Generate
        run: sqlc generate
      - name: Check no drift
        run: git diff --exit-code internal/db/generated/