# Dev-only infrastructure (PostgreSQL + Redis) for `go run` and `go test`.
# Runs as project "teammate-dev" with its own pgdata volume (password
# "teammate"), fully isolated from the production stack
# (docker-compose.prod.yml, project "teammate": pg 25432 / redis 26379 /
# app 28080) so both stacks can run simultaneously.
name: teammate-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: teammate
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
