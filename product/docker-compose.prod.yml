# ==============================================================
# Teammate Production Deployment — Docker Compose
#
# Start:
#   docker compose --env-file product/.env -f product/docker-compose.prod.yml up -d
#
# The app container runs database migrations automatically before starting the
# server (idempotent; concurrent instances are safe via advisory lock), so no
# separate migrate step is needed. To run migrations manually instead:
#   docker compose --env-file product/.env -f product/docker-compose.prod.yml \
#     run --rm --entrypoint teammate-server app migrate --path /app/migrations
#
# Environment file (.env) must contain:
#   TEAMS_JWT_SECRET=<random 64-char hex>
#   TEAMMATE_ENCRYPTION_KEY_BASE64=<32-byte Base64>
#   TEAMS_ALLOWED_ORIGINS=<frontend domain>
#
# Example key generation:
#   echo "TEAMS_JWT_SECRET=$(openssl rand -hex 32)" >> .env
#   echo "TEAMMATE_ENCRYPTION_KEY_BASE64=$(openssl rand 32 | base64 -w0)" >> .env
#
# Mirror acceleration for China (create .env or export):
#   DOCKER_REGISTRY=registry.cn-hangzhou.aliyuncs.com
#   GOPROXY=https://goproxy.cn,direct
#   ALPINE_REPO=mirrors.aliyun.com
#
#   docker compose --build-arg GOPROXY=$GOPROXY --build-arg ALPINE_REPO=$ALPINE_REPO \
#     -f product/docker-compose.prod.yml up -d
# ==============================================================

name: teammate

services:
  # ---- PostgreSQL (pgvector extension) ----
  postgres:
    image: ${DOCKER_REGISTRY:-}pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEAMS_DB_PASS:?TEAMS_DB_PASS is required}
      POSTGRES_DB: teammate
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d teammate：等待目标库真正可用，避免 initdb 临时阶段健康检查提前放行
      test: ["CMD-SHELL", "pg_isready -U postgres -d teammate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Teammate API Server ----
  app:
    build:
      context: ..
      dockerfile: product/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-}
        ALPINE_REPO: ${ALPINE_REPO:-}
        GO_IMAGE: ${DOCKER_REGISTRY:-}golang:1.26-alpine
        RUNTIME_IMAGE: ${DOCKER_REGISTRY:-}alpine:3.21
    # 先迁移后服务：容器启动时自动执行数据库迁移（幂等，golang-migrate 自带
    # Postgres advisory lock，多实例并发安全），成功后才启动 HTTP 服务，
    # 消除"服务已上线但表未建好"的窗口期。手动迁移命令见文件头部注释。
    entrypoint: ["sh", "-c", "teammate-server migrate --path /app/migrations && exec teammate-server"]
    ports:
      - "${TEAMS_PORT:-8080}:8080"
    environment:
      TEAMS_PORT: "8080"
      TEAMS_DATABASE_URL: "postgres://postgres:${TEAMS_DB_PASS:?TEAMS_DB_PASS is required}@postgres:5432/teammate?sslmode=disable"
      TEAMS_REDIS_URL: "redis://redis:6379/0"
      TEAMS_JWT_SECRET: "${TEAMS_JWT_SECRET:?TEAMS_JWT_SECRET is required}"
      TEAMS_ALLOWED_ORIGINS: "${TEAMS_ALLOWED_ORIGINS:?TEAMS_ALLOWED_ORIGINS is required}"
      TEAMS_BASE_URL: "${TEAMS_BASE_URL:-http://localhost:8080}"
      TEAMMATE_ENCRYPTION_KEY_BASE64: "${TEAMMATE_ENCRYPTION_KEY_BASE64:?TEAMMATE_ENCRYPTION_KEY_BASE64 is required}"
      # OAuth (optional)
      TEAMS_GITHUB_CLIENT_ID: "${TEAMS_GITHUB_CLIENT_ID:-}"
      TEAMS_GITHUB_SECRET: "${TEAMS_GITHUB_SECRET:-}"
      TEAMS_GOOGLE_CLIENT_ID: "${TEAMS_GOOGLE_CLIENT_ID:-}"
      TEAMS_GOOGLE_SECRET: "${TEAMS_GOOGLE_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- Teammate Frontend ----
  web:
    build:
      context: ..
      dockerfile: product/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://app:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NODE_IMAGE: ${DOCKER_REGISTRY:-}node:22-alpine
    ports:
      - "${WEB_PORT:-3333}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://app:8080}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
