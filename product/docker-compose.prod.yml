# ==============================================================
# Teammate 生产部署 — Docker Compose
#
# 启动方式：
#   docker compose --env-file product/.env -f product/docker-compose.prod.yml up -d
#
# 首次部署需执行数据库迁移：
#   docker compose --env-file product/.env -f product/docker-compose.prod.yml run --rm app migrate --path /app/migrations
#
# 环境变量文件（.env）必须包含：
#   TEAMS_JWT_SECRET=<随机 64 位 hex>
#   TEAMMATE_ENCRYPTION_KEY_BASE64=<32 字节 Base64>
#   TEAMS_ALLOWED_ORIGINS=<前端域名>
#
# 生成密钥示例：
#   echo "TEAMS_JWT_SECRET=$(openssl rand -hex 32)" >> .env
#   echo "TEAMMATE_ENCRYPTION_KEY_BASE64=$(openssl rand 32 | base64 -w0)" >> .env
#
# 国内镜像加速（创建 .env 或 export）：
#   DOCKER_REGISTRY=registry.cn-hangzhou.aliyuncs.com
#   GOPROXY=https://goproxy.cn,direct
#   ALPINE_REPO=mirrors.aliyun.com
#
#   docker compose --build-arg GOPROXY=$GOPROXY --build-arg ALPINE_REPO=$ALPINE_REPO \
#     -f product/docker-compose.prod.yml up -d
# ==============================================================

services:
  # ---- PostgreSQL（pgvector 扩展） ----
  postgres:
    image: ${DOCKER_REGISTRY:-}pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEAMS_DB_PASS:?TEAMS_DB_PASS is required}
      POSTGRES_DB: teammate
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Teammate API 服务器 ----
  app:
    build:
      context: ..
      dockerfile: product/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-}
        ALPINE_REPO: ${ALPINE_REPO:-}
        GO_IMAGE: ${DOCKER_REGISTRY:-}golang:1.26-alpine
        RUNTIME_IMAGE: ${DOCKER_REGISTRY:-}alpine:3.21
    ports:
      - "${TEAMS_PORT:-8080}:8080"
    environment:
      TEAMS_PORT: "8080"
      TEAMS_DATABASE_URL: "postgres://postgres:${TEAMS_DB_PASS:?TEAMS_DB_PASS is required}@postgres:5432/teammate?sslmode=disable"
      TEAMS_REDIS_URL: "redis://redis:6379/0"
      TEAMS_JWT_SECRET: "${TEAMS_JWT_SECRET:?TEAMS_JWT_SECRET is required}"
      TEAMS_ALLOWED_ORIGINS: "${TEAMS_ALLOWED_ORIGINS:?TEAMS_ALLOWED_ORIGINS is required}"
      TEAMS_BASE_URL: "${TEAMS_BASE_URL:-http://localhost:8080}"
      TEAMMATE_ENCRYPTION_KEY_BASE64: "${TEAMMATE_ENCRYPTION_KEY_BASE64:?TEAMMATE_ENCRYPTION_KEY_BASE64 is required}"
      # OAuth（可选）
      TEAMS_GITHUB_CLIENT_ID: "${TEAMS_GITHUB_CLIENT_ID:-}"
      TEAMS_GITHUB_SECRET: "${TEAMS_GITHUB_SECRET:-}"
      TEAMS_GOOGLE_CLIENT_ID: "${TEAMS_GOOGLE_CLIENT_ID:-}"
      TEAMS_GOOGLE_SECRET: "${TEAMS_GOOGLE_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- Teammate 前端 ----
  web:
    build:
      context: ..
      dockerfile: product/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://app:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NODE_IMAGE: ${DOCKER_REGISTRY:-}node:22-alpine
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://app:8080}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
